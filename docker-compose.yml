services:
  mysql:
    image: mysql:9.2
    environment:
    - MYSQL_ROOT_PASSWORD=secret
    - MYSQL_DATABASE=bookstack
    - MYSQL_USER=bookstack
    - MYSQL_PASSWORD=secret
    volumes:
    - mysql-data:/var/lib/mysql

  bookstack:
    image: solidnerd/bookstack:25.7.3
    depends_on:
    - mysql
    environment:
    - DB_HOST=mysql:3306
    - DB_DATABASE=bookstack
    - DB_USERNAME=bookstack
    - DB_PASSWORD=secret
    # Set the APP_ to the URL of bookstack without without a trailing slash,
    # but including any port numbers. For example, one of:
    # APP_URL=https://example.com
    # APP_URL=http://localhost:8080
    # APP_URL=https://wiki.example.com:8443
    - APP_URL=http://localhost:8080
    # APP_KEY is used for encryption where needed, so needs to be persisted to
    # preserve decryption abilities.
    # Can run `php artisan key:generate` to generate a key
    - APP_KEY=SomeRandomStringWith32Characters
    volumes:
    - uploads:/var/www/bookstack/public/uploads
    - storage-uploads:/var/www/bookstack/storage/uploads
    ports:
    - "8080:8080"

  api-manager:
    build: .
    depends_on:
    - bookstack
    ports:
    - "8000:8000"
    # O volume agora mapeia o diretório 'app' local para o diretório de trabalho do contêiner
    volumes:
    - ./app:/app/app
    working_dir: /app
    # O comando de execução agora aponta para o módulo 'app.main'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Carrega variáveis de ambiente do arquivo .env
    env_file:
      - .env
    # A URL do BookStack dentro da rede Docker é o nome do serviço: 'bookstack'
    # Esta variável é definida aqui para garantir que esteja sempre presente.
    environment:
      BOOKSTACK_API_URL: http://bookstack:8080/api

volumes:
  mysql-data:
  uploads:
  storage-uploads: