services:
  database:
    image: postgres:16-alpine
    env_file:
      - .env
    container_name: wiki_db
    environment:
      POSTGRES_USER: wiki_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wiki_db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: always

  wiki:
    image: ghcr.io/requarks/wiki:2
    env_file:
      - .env
    container_name: wiki_app
    environment:
      DB_TYPE: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: wiki_user
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: wiki_db
      # Configuração inicial do administrador (opcional, pode ser feito via interface)
      # WIKI_ADMIN_EMAIL: ${WIKI_ADMIN_EMAIL}
      # WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD}
    ports:
      - "80:3000" # Mapeia a porta 80 do host para a porta 3000 do container
    depends_on:
      - database
    volumes:
      - ./data/wiki:/var/lib/wikijs
    restart: always